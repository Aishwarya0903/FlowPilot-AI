server:
  port: 8080

spring:
  application:
    name: flowpilot-ai-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowpilot}
    username: ${DB_USERNAME:flowpilot_user}
    password: ${DB_PASSWORD:flowpilot_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:Zmxvd3BpbG90LWFpLXN1cGVyLXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tZW52aXJvbm1lbnQ=}
    access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:3600000}      # 1 hour
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    provider: ${AI_PROVIDER:mock}      # mock | gemini
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-1.5-flash}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.flowpilot: INFO
    org.springframework.security: WARN
